---
# Full homelab deploy: router + servers
#
# Layer model (roles grouped by deployment layer):
#   Layer 1: Barebone     — OS setup, users, configs
#   Layer 2: OS Services  — native binaries, system-level services
#   Layer 3: Shared       — foundational services (traefik, databases)
#   Layer 4: Platform     — monitoring, alerting, observability
#   Layer 5: Tools        — utility and admin interfaces
#   Layer 6: Home         — user-facing home services
#   Layer 7: Dev          — development services
#
# Usage:
#   ansible-playbook site.yml                           # full deploy
#   ansible-playbook site.yml --tags layer_barebone     # barebone only
#   ansible-playbook site.yml --tags layer_os_services  # OS services only
#   ansible-playbook site.yml --tags layer_shared       # shared dependencies only
#   ansible-playbook site.yml --tags layer_platform     # platform services only
#   ansible-playbook site.yml --tags layer_tools        # tools only
#   ansible-playbook site.yml --tags layer_home         # home services only
#   ansible-playbook site.yml --tags traefik            # single service
#   ansible-playbook site.yml --tags router             # router only
#   ansible-playbook site.yml --tags servers            # servers only
#   ansible-playbook site.yml --limit lab2              # all roles, only on lab2
#

# ── Play 1: OpenWrt router ─────────────────────────────────────────────
# OpenWrt has no Python interpreter and very limited storage — automatic fact gathering
# (which requires Python) is impractical to install on the device.
- name: Configure OpenWrt router
  hosts: routers
  gather_facts: false
  become: false
  tags: [router]
  vars_files:
    - ../vault/secrets.yml

  pre_tasks:
    - name: Warn that check mode is not supported for this playbook
      ansible.builtin.fail:
        msg: >
          The router playbook does not support --check mode.
          Re-run without --check.
      when: ansible_check_mode

  roles:
    - role: community.openwrt.init
      tags: [always]
    - role: barebone/openwrt_base
      tags: [layer_barebone]
    - role: barebone/openwrt_adblock
      tags: [layer_barebone]
    - role: os_services/openwrt_step_ca
      tags: [step_ca, layer_os_services]

# ── Play 2: Servers ────────────────────────────────────────────────────
# Dependency chain (resolved automatically via role meta/main.yml):
#   barebone/server_base → os_services/step_cli → shared/traefik → [services]
#   shared/postgres + shared/meilisearch → linkwarden
#
# Roles are deduplicated within this play — dependencies run once.
# Guards (`when: inventory_hostname in groups[...`) prevent execution on wrong hosts.
- name: Deploy homelab services
  hosts: servers
  gather_facts: true
  become: true
  # tags: [servers]
  vars_files:
    - ../vault/secrets.yml

  roles:
    # ── Layer 1: Barebone ──────────────────────────────────────────────
    # OS setup, users, configs (runs on all servers)
    - role: barebone/server_base
      tags: [server_base, layer_barebone]

    # ── Layer 2: OS Services ───────────────────────────────────────────
    # Native binaries, system-level services
    - role: os_services/docker
      tags: [docker, layer_os_services]
      when: inventory_hostname in groups.get('docker_hosts', [])

    - role: os_services/step_cli
      tags: [step_cli, layer_os_services]

    - role: os_services/kopia_server
      tags: [kopia_server, layer_os_services]
      when: inventory_hostname in groups.get('kopia_server_hosts', [])

    - role: os_services/kopia_agent
      tags: [kopia_agent, layer_os_services]
      when: inventory_hostname in groups.get('kopia_agent_hosts', [])

    # ── Layer 3: Shared ────────────────────────────────────────────────
    # Foundational services — traefik proxy, databases, caches.
    # Layers 4-7 can depend on these, but are not obliged to.
    # Roles: shared/traefik, shared/postgres, shared/meilisearch
    - role: shared/meilisearch
      tags: [meilisearch, layer_shared]
      when: inventory_hostname in groups.get('meilisearch_hosts', [])

    - role: shared/postgres
      tags: [postgres, layer_shared]
      when: inventory_hostname in groups.get('postgres_hosts', [])

    - role: shared/traefik
      tags: [traefik, layer_shared]
      when: inventory_hostname in groups.get('traefik_hosts', [])

    # ── Layer 4: Platform ──────────────────────────────────────────────
    # Monitoring, alerting, observability. Manages and observes the platform.
    # Roles: platform/beszel_hub, platform/beszel_agent, platform/dockhand, platform/dockhand_agent
    - role: platform/beszel_hub
      tags: [beszel_hub, layer_platform]
      when: inventory_hostname in groups.get('beszel_hub_hosts', [])

    - role: platform/beszel_agent
      tags: [beszel_agent, layer_platform]
      when: inventory_hostname in groups.get('beszel_agent_hosts', [])

    - role: platform/dockhand
      tags: [dockhand, layer_platform]
      when: inventory_hostname in groups.get('dockhand_hosts', [])

    - role: platform/dockhand_agent
      tags: [dockhand_agent, layer_platform]
      when: inventory_hostname in groups.get('dockhand_agent_hosts', [])

    # ── Layer 5: Tools ─────────────────────────────────────────────────
    # Utility and admin interfaces. Stateless or lightly stateful tools.
    # Roles: tools/cyberchef, tools/it_tools, tools/dbgate, tools/searxng
    - role: tools/cyberchef
      tags: [cyberchef, layer_tools]
      when: inventory_hostname in groups.get('cyberchef_hosts', [])

    - role: tools/it_tools
      tags: [it_tools, layer_tools]
      when: inventory_hostname in groups.get('it_tools_hosts', [])

    - role: tools/dbgate
      tags: [dbgate, layer_tools]
      when: inventory_hostname in groups.get('dbgate_hosts', [])

    - role: tools/searxng
      tags: [searxng, layer_tools]
      when: inventory_hostname in groups.get('searxng_hosts', [])

    # ── Layer 6: Home ──────────────────────────────────────────────────
    # User-facing home services. Passwords, downloads, media, bookmarks, etc.
    # Roles: home/vaultwarden, home/qbittorrent, home/inpx_web, home/linkwarden,
    #        home/immich, home/jellyfin, home/arr_stack, home/homepage
    - role: home/vaultwarden
      tags: [vaultwarden, layer_home]
      when: inventory_hostname in groups.get('vaultwarden_hosts', [])

    - role: home/qbittorrent
      tags: [qbittorrent, layer_home]
      when: inventory_hostname in groups.get('qbittorrent_hosts', [])

    - role: home/inpx_web
      tags: [inpx_web, layer_home]
      when: inventory_hostname in groups.get('inpx_web_hosts', [])

    - role: home/linkwarden
      tags: [linkwarden, layer_home]
      when: inventory_hostname in groups.get('linkwarden_hosts', [])

    - role: home/immich
      tags: [immich, layer_home]
      when: inventory_hostname in groups.get('immich_hosts', [])

    - role: home/homepage
      tags: [homepage, layer_home]
      when: inventory_hostname in groups.get('homepage_hosts', [])

    - role: home/jellyfin
      tags: [jellyfin, layer_home]
      when: inventory_hostname in groups.get('jellyfin_hosts', [])

    # ── Arr-Stack (disabled: indexers return 403, Seerr setup broken for Jellyfin) ──
    # - role: home/arr_stack
    #   tags: [arr_stack, layer_home]
    #   when: inventory_hostname in groups.get('arr_stack_hosts', [])

    # ── Layer 7: Dev ───────────────────────────────────────────────────
    # Development services. Forgejo, weblate, dev databases, dev homepage.
    # Roles: (empty — future dev services)
