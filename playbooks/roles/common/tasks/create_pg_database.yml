---
# Create PostgreSQL user and database on the PG host
# Requires: pg_db_name, pg_db_user, pg_db_password

- name: Create PostgreSQL user "{{ pg_db_user }}"
  ansible.builtin.command:
    cmd: "docker compose exec -T postgres psql -U {{ postgres_user | default('postgres') }} -d postgres -c \"DO $$ BEGIN CREATE USER {{ pg_db_user }} WITH PASSWORD '{{ pg_db_password }}'; EXCEPTION WHEN duplicate_object THEN NULL; END $$;\""
  args:
    chdir: "{{ postgres_opt_dir }}"
  changed_when: false
  delegate_to: "{{ groups['postgres_hosts'][0] }}"

- name: Create PostgreSQL database "{{ pg_db_name }}"
  ansible.builtin.command:
    cmd: "docker compose exec -T postgres psql -U {{ postgres_user | default('postgres') }} -d postgres -c \"SELECT 'CREATE DATABASE {{ pg_db_name }} OWNER {{ pg_db_user }}' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ pg_db_name }}')\\gexec\""
  args:
    chdir: "{{ postgres_opt_dir }}"
  changed_when: false
  delegate_to: "{{ groups['postgres_hosts'][0] }}"
