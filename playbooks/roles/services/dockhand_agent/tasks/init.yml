---
# Wait for Hawser to be healthy

- name: Wait for Hawser to be healthy
  ansible.builtin.uri:
    url: "http://{{ inventory_hostname }}.{{ lan_domain }}:{{ dockhand_agent_port }}/_hawser/health"
    validate_certs: false
    status_code: 200
  register: _hawser_ready
  until: _hawser_ready.status == 200
  retries: 10
  delay: 3

- name: Login as ansible user
  ansible.builtin.uri:
    url: "http://{{ groups['dockhand_hosts'][0] }}.{{ lan_domain }}:{{ dockhand_web_port }}/api/auth/login"
    method: POST
    body_format: json
    body:
      username: "{{ dockhand_ansible_user }}"
      password: "{{ dockhand_ansible_password }}"
    validate_certs: false
    status_code: 200
  register: _dockhand_login
  delegate_to: localhost
  become: false
  no_log: true

- name: Create API bearer token
  ansible.builtin.uri:
    url: "http://{{ groups['dockhand_hosts'][0] }}.{{ lan_domain }}:{{ dockhand_web_port }}/api/auth/tokens"
    method: POST
    body_format: json
    body:
      name: "ansible-agent"
      password: "{{ dockhand_ansible_password }}"
    validate_certs: false
    status_code: 201
    headers:
      Cookie: "{{ _dockhand_login.set_cookie }}"
  register: _dockhand_api_token
  delegate_to: localhost
  become: false
  no_log: true
