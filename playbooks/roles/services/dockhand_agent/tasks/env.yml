---
# Register remote Docker environment in DockHand

- ansible.builtin.include_role:
    name: common
    tasks_from: register_dockhand_env
  vars:
    _dockhand_server: "{{ groups['dockhand_hosts'][0] }}.{{ lan_domain }}"
    _dockhand_env_name: "{{ inventory_hostname }}"
    _dockhand_env_common:
      name: "{{ inventory_hostname }}"
      tlsSkipVerify: true
      icon: "server"
      collectActivity: true
      collectMetrics: true
      highlightChanges: true
      labels: []
      publicIp: "{{ inventory_hostname }}.{{ lan_domain }}"
    _dockhand_env_body:
      connectionType: "direct"
      host: "{{ inventory_hostname }}.{{ lan_domain }}"
      port: "{{ dockhand_agent_port }}"
      protocol: "http"
