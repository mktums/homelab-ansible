---
- name: Create DockHand agent directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ dockhand_agent_opt_dir }}"
    - "{{ dockhand_agent_stacks_dir }}"

- name: Render compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ dockhand_agent_opt_dir }}/docker-compose.yml"
    mode: "0644"

- name: Deploy DockHand agent stack
  community.docker.docker_compose_v2:
    project_src: "{{ dockhand_agent_opt_dir }}"
    files:
      - docker-compose.yml
    state: present
    pull: missing
  notify: Restart DockHand agent
