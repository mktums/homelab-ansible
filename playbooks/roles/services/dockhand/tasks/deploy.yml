---
- name: Detect Docker group GID
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: _docker_sock_stat

- name: Set Docker GID fact
  ansible.builtin.set_fact:
    _dockhand_docker_gid: "{{ _docker_sock_stat.stat.gid }}"

- name: Create DockHand directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ dockhand_opt_dir }}"
    - "{{ dockhand_data_dir }}"

- name: Render compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ dockhand_opt_dir }}/docker-compose.yml"
    mode: "0644"

- name: Deploy DockHand stack
  community.docker.docker_compose_v2:
    project_src: "{{ dockhand_opt_dir }}"
    files:
      - docker-compose.yml
    state: present
    pull: missing
  notify: Restart DockHand
