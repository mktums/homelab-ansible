---
- name: Deploy DockHand
  block:
    - ansible.builtin.include_tasks: deploy.yml
    - ansible.builtin.include_tasks: auth.yml
    - ansible.builtin.include_tasks: settings.yml
    - ansible.builtin.include_tasks: env.yml
    - ansible.builtin.include_tasks: cname.yml
  when: inventory_hostname in groups.get('dockhand_hosts', [])
