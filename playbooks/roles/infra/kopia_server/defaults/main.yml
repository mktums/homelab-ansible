# Kopia server defaults

# Image
kopia_image_name: "kopia/kopia"
kopia_image_tag: "0.23"

# Paths
kopia_opt_dir: "{{ ansible_opt_base }}/kopia_server"
kopia_config_dir: "{{ docker_data_base }}/kopia_server/config"
kopia_cache_dir: "{{ docker_data_base }}/kopia_server/cache"
kopia_logs_dir: "{{ docker_data_base }}/kopia_server/logs"
kopia_repo_path: "/mnt/backup/kopia"

# Network (internal, Traefik terminates TLS externally)
kopia_internal_port: 51514

# CNAME subdomain (without .{{ lan_domain }})
kopia_cname: "kopia"

# Maintenance owner user@hostname
kopia_maintenance_owner: "root@kopia"

# ── Sync-to (secondary repository for 3-2-1) ───────────────────────────
kopia_sync_secondary_enabled: false
kopia_sync_secondary_repo_path: "/mnt/green/kopia-repo-sync"
kopia_sync_secondary_timer_on_calendar: "*-*-* 04:30:00"

# ── Sync-to (tertiary repository for 3-2-1, USB rotation) ──────────────
kopia_sync_tertiary_enabled: false
kopia_sync_tertiary_serial: "S6NSNS0W103280N"
kopia_sync_tertiary_mount_point: "/mnt/t7"
kopia_sync_tertiary_repo_path: "{{ kopia_sync_tertiary_mount_point }}/kopia-repo-sync"
