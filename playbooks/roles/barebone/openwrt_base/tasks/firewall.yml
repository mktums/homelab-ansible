---
# Rename default anonymous zones to named sections so we can reference them explicitly.
# OpenWrt defaults: @zone[0]=lan, @zone[1]=wan — we rename them once, idempotently.
- name: Rename default firewall zones to named sections
  community.openwrt.uci:
    command: rename
    key: "firewall.{{ item.src }}"
    name: "{{ item.dst }}"
  loop:
    - { src: '@zone[0]', dst: lan_zone }
    - { src: '@zone[1]', dst: wan_zone }
  failed_when: false

- name: Configure LAN firewall zone
  community.openwrt.uci:
    command: section
    config: firewall
    type: zone
    name: lan_zone
    find: {}
    value:
      name: lan
      input: ACCEPT
      output: ACCEPT
      forward: ACCEPT
    replace: true
  notify: Commit and reload firewall

- name: Configure WAN firewall zone
  community.openwrt.uci:
    command: section
    config: firewall
    type: zone
    name: wan_zone
    find: {}
    value:
      name: wan
      input: REJECT
      output: ACCEPT
      forward: REJECT
      masq: "1"
    replace: true
  notify: Commit and reload firewall

- name: Configure IoT firewall zone
  community.openwrt.uci:
    command: section
    config: firewall
    type: zone
    name: iot_zone
    find: {}
    value:
      name: iot
      network: iot
      input: DROP
      output: ACCEPT
      forward: DROP
    replace: true
  notify: Commit and reload firewall

- name: Configure IoT DHCP rule
  community.openwrt.uci:
    command: section
    config: firewall
    type: rule
    name: iot_dhcp
    find: {}
    value:
      src: iot
      dest_port: "67-68"
      proto: udp
      target: ACCEPT
    replace: true
  notify: Commit and reload firewall

- name: Configure IoT DNS rule
  community.openwrt.uci:
    command: section
    config: firewall
    type: rule
    name: iot_dns
    find: {}
    value:
      src: iot
      dest_port: "53"
      proto: "tcp udp"
      target: ACCEPT
    replace: true
  notify: Commit and reload firewall

- name: Configure IoT to WAN forwarding
  community.openwrt.uci:
    command: section
    config: firewall
    type: forwarding
    name: iot_to_wan
    find: {}
    value:
      src: iot
      dest: wan
    replace: true
  notify: Commit and reload firewall

- name: Configure LAN to IoT forwarding
  community.openwrt.uci:
    command: section
    config: firewall
    type: forwarding
    name: lan_to_iot
    find: {}
    value:
      src: lan
      dest: iot
    replace: true
  notify: Commit and reload firewall

- name: Configure port forwards
  community.openwrt.uci:
    command: section
    config: firewall
    type: redirect
    name: "{{ item.name }}_fwd"
    find: {}
    value:
      name: "{{ item.name }}"
      target: DNAT
      src: wan
      proto: "{{ item.proto }}"
      src_dport: "{{ item.src_dport }}"
      dest: lan
      dest_ip: "{{ item.dest_ip }}"
      dest_port: "{{ item.dest_port }}"
    replace: true
  loop: "{{ port_forwards }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Commit and reload firewall

- name: Block LAN clients from bypassing router DNS
  community.openwrt.uci:
    command: section
    config: firewall
    type: rule
    name: block_public_dns
    find: {}
    value:
      name: "Block-Public-DNS"
      src: "lan"
      dest: "wan"
      dest_port: "53 853"
      target: "REJECT"
    replace: true
  notify: Commit and reload firewall
