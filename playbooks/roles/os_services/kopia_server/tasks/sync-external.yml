---
# sync-external.yml — external repository (USB rotation, 3-2-1)

- name: Create external mount and script directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "root"
    mode: "0755"
  loop:
    - "{{ kopia_sync_external_mount_point }}"
    - "{{ kopia_opt_dir }}/kopia-sync-external"

- name: Deploy external sync script
  ansible.builtin.template:
    src: kopia-sync-external.sh.j2
    dest: "{{ kopia_opt_dir }}/kopia-sync-external/kopia-sync-external.sh"
    mode: "0750"

- name: Deploy external service unit
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: kopia-sync-external.service.j2, dest: /etc/systemd/system/kopia-sync-external.service, mode: '0644' }
  notify: Reload systemd

- name: Deploy udev rule for external drive detection
  ansible.builtin.template:
    src: kopia-external-udev.rules.j2
    dest: /etc/udev/rules.d/99-kopia-external.rules
    mode: "0644"
  notify: Reload udev
