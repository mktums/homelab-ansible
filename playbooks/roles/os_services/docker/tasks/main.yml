---
- name: Install Docker apt dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present

- name: Create /etc/apt/keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: false

- name: Get system architecture
  ansible.builtin.command: dpkg --print-architecture
  register: _dpkg_arch
  changed_when: false

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    architectures: "{{ _dpkg_arch.stdout }}"
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users | default([]) }}"

- name: Ensure Docker config directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: Write Docker daemon configuration
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0644"
    backup: true
  notify: Restart Docker

- name: Ensure systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"
  when: docker_tcp_host | bool

- name: Ensure Docker TLS directory exists
  ansible.builtin.file:
    path: /etc/docker/tls
    state: directory
    mode: "0700"
  when: docker_tcp_host | bool

- name: Check Docker TLS cert validity (exists, SANs, expiry)
  ansible.builtin.shell: |
    CERT="/etc/docker/tls/server-cert.pem"
    if [ ! -f "$CERT" ]; then echo "missing"; exit 0; fi
    SANs=$(openssl x509 -in "$CERT" -noout -ext subjectAltName 2>/dev/null)
    if ! echo "$SANs" | grep -q "DNS:{{ inventory_hostname }}.{{ lan_domain }}"; then echo "no-san"; exit 0; fi
    if ! echo "$SANs" | grep -q "IP Address:127.0.0.1"; then echo "no-loopback"; exit 0; fi
    EXPIRY=$(date -d "$(openssl x509 -enddate -noout -in "$CERT" | cut -d= -f2)" +%s)
    DAYS_LEFT=$(( (EXPIRY - $(date +%s)) / 86400 ))
    if [ "$DAYS_LEFT" -lt 30 ]; then echo "expiring"; exit 0; fi
    echo "ok"
  register: _docker_tls_check
  changed_when: false
  when: docker_tcp_host | bool

- name: Generate Docker TLS cert (online JWK)
  when: docker_tcp_host | bool and _docker_tls_check.stdout != 'ok'
  block:
    - name: Generate Docker TLS token
      ansible.builtin.shell: |
        step-cli ca token "{{ inventory_hostname }}.{{ lan_domain }}" \
          --provisioner "admin@{{ step_ca_cname }}.{{ lan_domain }}" \
          --password-file /root/.step/secrets/jwk_password.txt \
          --san "{{ inventory_hostname }}.{{ lan_domain }}" \
          --san "{{ ansible_facts['default_ipv4']['address'] }}" \
          --san "127.0.0.1"
      register: _docker_tls_token
      changed_when: true

    - name: Issue Docker TLS certificate
      ansible.builtin.command: |
        step-cli ca certificate -f --token "{{ _docker_tls_token.stdout }}" \
          --not-after 8760h \
          "{{ inventory_hostname }}.{{ lan_domain }}" \
          /etc/docker/tls/server-cert.pem \
          /etc/docker/tls/server-key.pem
      changed_when: true

- name: Enable Docker TLS API listener
  ansible.builtin.template:
    src: docker-override.conf.j2
    dest: /etc/systemd/system/docker.service.d/override.conf
    mode: "0644"
  notify:
    - Reload systemd daemon
    - Restart Docker
  when: docker_tcp_host | bool

- name: Register Docker TLS cert for auto-renewal
  ansible.builtin.include_role:
    name: common_tasks
    tasks_from: register_jwk_renewal
  vars:
    renewal_name: "docker"
    renewal_domain: "{{ inventory_hostname }}.{{ lan_domain }}"
    renewal_cert: "/etc/docker/tls/server-cert.pem"
    renewal_key: "/etc/docker/tls/server-key.pem"
    renewal_service: "docker"
    renewal_ca_url: "https://{{ step_ca_cname }}.{{ lan_domain }}:8443"
    renewal_issuer: "admin@{{ step_ca_cname }}.{{ lan_domain }}"
  when: docker_tcp_host | bool

- name: Install nvidia-container-toolkit
  when: nvidia_gpu | default(false)
  block:
    - name: Add NVIDIA container toolkit GPG key
      ansible.builtin.get_url:
        url: https://nvidia.github.io/libnvidia-container/gpgkey
        dest: /etc/apt/keyrings/nvidia-container-toolkit.asc
        mode: "0644"
        force: false

    - name: Add NVIDIA container toolkit repository
      ansible.builtin.deb822_repository:
        name: nvidia-container-toolkit
        types: deb
        uris: "https://nvidia.github.io/libnvidia-container/stable/deb/{{ _dpkg_arch.stdout }}"
        suites: /
        components: []
        signed_by: /etc/apt/keyrings/nvidia-container-toolkit.asc
        state: present

    - name: Install nvidia-container-toolkit package
      ansible.builtin.apt:
        name: nvidia-container-toolkit
        state: present
        update_cache: true

    - name: Check if NVIDIA runtime already configured
      ansible.builtin.stat:
        path: /etc/docker/daemon.json
      register: _daemon_json

    - name: Read daemon.json if exists
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: _daemon_json_content
      when: _daemon_json.stat.exists

    - name: Configure Docker to use NVIDIA runtime
      ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker
      notify: Restart Docker
      when: >
        not _daemon_json.stat.exists or
        'nvidia' not in (_daemon_json_content.content | default('') | b64decode)

- name: Enable and start Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
