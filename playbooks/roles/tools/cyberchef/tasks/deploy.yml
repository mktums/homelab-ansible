---
- name: Create CyberChef directories
  ansible.builtin.file:
    path: "{{ cyberchef_opt_dir }}"
    state: directory
    mode: "0755"

- name: Render compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ cyberchef_opt_dir }}/docker-compose.yml"
    mode: "0644"

- name: Deploy CyberChef stack
  community.docker.docker_compose_v2:
    project_src: "{{ cyberchef_opt_dir }}"
    state: present
    pull: missing
  notify: Restart CyberChef
