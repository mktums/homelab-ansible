---
# Register local Docker environment in DockHand

- ansible.builtin.include_role:
    name: common_tasks
    tasks_from: register_dockhand_env
  vars:
    _dockhand_server: "{{ inventory_hostname }}.{{ lan_domain }}"
    _dockhand_env_name: "{{ inventory_hostname }}"
    _dockhand_env_common:
      name: "{{ inventory_hostname }}"
      tlsSkipVerify: true
      icon: "server"
      collectActivity: true
      collectMetrics: true
      highlightChanges: true
      labels: []
      publicIp: "{{ inventory_hostname }}.{{ lan_domain }}"
    _dockhand_env_body:
      connectionType: "socket"
      socketPath: "/var/run/docker.sock"
