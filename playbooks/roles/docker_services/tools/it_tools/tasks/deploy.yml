---
- name: Create IT-Tools directories
  ansible.builtin.file:
    path: "{{ it_tools_opt_dir }}"
    state: directory
    mode: "0755"

- name: Render compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ it_tools_opt_dir }}/docker-compose.yml"
    mode: "0644"

- name: Deploy IT-Tools stack
  community.docker.docker_compose_v2:
    project_src: "{{ it_tools_opt_dir }}"
    state: present
    pull: missing
  notify: Restart IT-Tools
