---
- name: Create Homepage directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ homepage_opt_dir }}"
    - "{{ homepage_config_dir }}"

- name: Render config files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ homepage_config_dir }}/{{ item }}"
    mode: "0644"
  loop: "{{ homepage_config_files }}"

- name: Render compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ homepage_opt_dir }}/docker-compose.yml"
    mode: "0644"

- name: Deploy Homepage stack
  community.docker.docker_compose_v2:
    project_src: "{{ homepage_opt_dir }}"
    state: present
    pull: missing
  notify: Restart Homepage
