# Arr-Stack defaults

# Paths
arr_stack_opt_dir: "{{ ansible_opt_base }}/arr_stack"
arr_stack_data_dir: "{{ docker_data_base }}/arr_stack"

# ── Images ────────────────────────────────────────────────────────────────

arr_radarr_image: "lscr.io/linuxserver/radarr"
arr_radarr_tag: "latest"

arr_sonarr_image: "lscr.io/linuxserver/sonarr"
arr_sonarr_tag: "latest"

arr_prowlarr_image: "lscr.io/linuxserver/prowlarr"
arr_prowlarr_tag: "latest"

arr_lidarr_image: "lscr.io/linuxserver/lidarr"
arr_lidarr_tag: "latest"

arr_bazarr_image: "lscr.io/linuxserver/bazarr"
arr_bazarr_tag: "latest"

arr_seerr_image: "ghcr.io/seerr-team/seerr"
arr_seerr_tag: "latest"

# ── Host ports ────────────────────────────────────────────────────────────

arr_radarr_port: 7878
arr_sonarr_port: 8989
arr_prowlarr_port: 9696
arr_lidarr_port: 8686
arr_bazarr_port: 6767
arr_seerr_port: 5055

# ── CNAMEs ────────────────────────────────────────────────────────────────

arr_radarr_cname: "radarr"
arr_sonarr_cname: "sonarr"
arr_prowlarr_cname: "prowlarr"
arr_lidarr_cname: "lidarr"
arr_bazarr_cname: "bazarr"
arr_seerr_cname: "seerr"
