---
- name: Create Meilisearch directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ meilisearch_opt_dir }}"
    - "{{ meilisearch_data_dir }}"

- name: Render compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ meilisearch_opt_dir }}/docker-compose.yml"
    mode: "0644"

- name: Deploy Meilisearch stack
  community.docker.docker_compose_v2:
    project_src: "{{ meilisearch_opt_dir }}"
    state: present
    wait: true
    wait_timeout: 300
    pull: missing
  notify: Restart meilisearch
