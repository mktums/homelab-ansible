# ── Vault secrets example ────────────────────────────────────────────────
#
# Copy to secrets.yml and fill in all values before running the playbook.
#
#   cp vault/secrets.example.yml vault/secrets.yml
#   ansible-vault encrypt vault/secrets.yml
#
# Variables are ordered by playbook execution:
#   Play 1 (router) → Play 2 (servers, layer 1 → 2 → 3)
#
# Variable flags:
#
#   [GENERATED] — Generated by the playbook on first run, but you must
#                 manually copy the value into secrets.yml. The role prints
#                 the value (or base64-encoded string) to the console and
#                 saves raw files to the vault/ directory on the controller.
#                 Leave empty on first run; after the playbook completes,
#                 copy the printed value and re-run.
#                 Example: step-ca generates root cert/key/JWK on the router,
#                 saves raw files to vault/, and prints the base64 strings
#                 to add to secrets.yml.
#
#   [POST-DEPLOY] — Must be set manually after the first deployment. These
#                   values are generated inside the service itself (web UI,
#                   API, etc.) and cannot be known in advance. Deploy the
#                   service first, create the token/key in the UI, then add
#                   it to secrets.yml and re-run the playbook.
#                   Example: Beszel token is created in Settings → Tokens
#                   after the hub is up and running.

# ── Common ───────────────────────────────────────────────────────────────
# Used across all server roles (barebone, traefik, etc.)

# Admin user for all servers
vault_admin_user: ""

# SSH public key for the admin user (added to ~/.ssh/authorized_keys)
vault_admin_ssh_pubkey: ""

# Sudo password for the admin user (used by Ansible for become)
vault_become_password: ""

# bcrypt salt for password hashing (exactly 22 chars of [./A-Za-z0-9])
# Generate: python3 -c "import bcrypt; print(bcrypt.gensalt()[7:].decode())"
vault_bcrypt_salt: ""

# ── Router (openwrt_base) ───────────────────────────────────────────────
# Used in Play 1 for OpenWrt configuration

# SSH password for root@router (required for password-based SSH via sshpass)
vault_router_ssh_pass: ""

# Wi-Fi passwords
vault_wifi_main_password: ""   # Main network (WPA3/WPA2, hidden SSID)
vault_wifi_iot_password: ""    # IoT network (WPA2, isolated)

# ── step-ca (openwrt_step_ca) ───────────────────────────────────────────
# Runs on the router in Play 1, then distributes to servers in Play 2

# Password for step-ca ACME account
vault_step_ca_password: ""

# Root CA certificate (base64, [GENERATED] on first run)
vault_step_ca_root_cert: ""

# Root CA private key (base64, [GENERATED] on first run)
vault_step_ca_root_key: ""

# JWK public key (base64, [GENERATED] on first run)
vault_step_ca_jwk_pub: ""

# JWK private key (base64, [GENERATED] on first run)
# Copied from router /etc/step-ca/secrets/jwk_priv.json; used by step_cli role on servers
vault_step_ca_jwk_priv: ""

# ── Kopia (layer 2) ─────────────────────────────────────────────────────
# Native backup — server on lab1, agents on all servers

# Repository encryption password
vault_kopia_repo_password: ""

# Kopia server admin credentials (web UI login)
vault_kopia_server_admin_user: ""
vault_kopia_server_admin_pass: ""

# Control RPC password (used by CLI for repository operations)
vault_kopia_control_password: ""

# ── Meilisearch (layer 3a: shared) ──────────────────────────────────────
# Search engine (used by linkwarden)

# Master key for Meilisearch API
# Generate: openssl rand -hex 32
vault_meilisearch_master_key: ""

# ── Postgres (layer 3a: shared) ─────────────────────────────────────────
# Database server

# Password for the default Postgres superuser
vault_postgres_password: ""

# ── Traefik (layer 3b: infra) ───────────────────────────────────────────
# Reverse proxy and ACME certificate management

# Password for Traefik dashboard (basic auth, paired with vault_admin_user)
vault_traefik_dashboard_password: ""

# ── Beszel (layer 3b: infra) ────────────────────────────────────────────
# Monitoring

# Admin user credentials (web UI login)
vault_beszel_admin_email: ""
vault_beszel_admin_password: ""

# Hub token ([POST-DEPLOY] Settings → Tokens in Beszel UI)
vault_beszel_token: ""

# Hub public key ([POST-DEPLOY] Add System → public key in Beszel UI)
vault_beszel_hub_key: ""

# ── DockHand (layer 3b: infra) ──────────────────────────────────────────
# Docker management UI

# Admin user credentials (web UI login)
vault_dockhand_admin_user: ""
vault_dockhand_admin_password: ""

# Ansible service user (used by register_dockhand_env task)
vault_dockhand_ansible_user: ""
vault_dockhand_ansible_password: ""

# Database password for DockHand
vault_dockhand_db_password: ""

# ── Vaultwarden (layer 3d: app) ─────────────────────────────────────────
# Password manager

# Admin emergency token ([POST-DEPLOY] set via Vaultwarden web UI after first login)
vault_vaultwarden_admin_token: ""

# Database password for Vaultwarden (Postgres)
vault_vaultwarden_db_password: ""

# ── qBittorrent (layer 3d: app) ─────────────────────────────────────────
# Torrent client

# Admin password for qBittorrent web UI
vault_qbittorrent_password: ""

# ── Linkwarden (layer 3d: app) ──────────────────────────────────────────
# Bookmark manager

# NextAuth session secret
# Generate: openssl rand -hex 32
vault_linkwarden_nextauth_secret: ""

# Database password for Linkwarden (Postgres)
vault_linkwarden_db_password: ""
