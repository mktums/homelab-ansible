---
system_optimize_mounts:
  - /
  - /mnt/data

# ── Kopia backup sources ────────────────────────────────────────────────
backup_sources:
  dockhand:
    hostname: server
    paths:
      "{{ dockhand_data_dir }}":
        retention:
          keep_latest: 10
          keep_hourly: 48
          keep_daily: 7
          keep_weekly: 4
          keep_monthly: 24
          keep_annual: 3
