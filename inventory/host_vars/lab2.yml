---
system_optimize_mounts:
  - /
  - /data

# Beszel agent configuration for lab2
beszel_smart_devices:
  - /dev/sda:/dev/sda
  - /dev/sdb:/dev/sdb
beszel_smart_cap_add:
  - SYS_RAWIO
  - SYS_ADMIN
beszel_extra_volumes:
  - /data/.beszel:/extra-filesystems/sda1:ro

# ── Kopia backup sources ────────────────────────────────────────────────
backup_sources:
  dockhand_agent:
    hostname: server
    paths:
      "{{ dockhand_agent_data_dir }}":
        retention:
          keep_latest: 10
          keep_daily: 7
          keep_monthly: 6
